<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T.Salmon 스크린샷 정리</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #22201f;
      --muted: #7b7370;
      --paper: #fffcf8;
      --wash: #f7f1ec;
      --line: #e7dcd4;
      --salmon: #e76f61;
      --salmon-dark: #b84e44;
      --sage: #4d7c6f;
      --sage-soft: #f2f8f5;
      --warning: #9a5b13;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #eee8e2;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .phone {
      display: flex;
      flex-direction: column;
      width: min(100%, 430px);
      height: min(860px, calc(100vh - 40px));
      min-height: 680px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(40, 32, 26, .18);
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 18px 14px;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .icon-button {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 18px;
      font-weight: 800;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 10px;
      background: var(--wash);
    }

    .row {
      display: flex;
      margin: 7px 0;
    }

    .row.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 84%;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      box-shadow: 0 4px 12px rgba(40, 32, 26, .035);
      line-height: 1.44;
      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: anywhere;
      font-size: 15px;
      font-weight: 500;
    }

    .user .bubble {
      border-color: transparent;
      color: white;
      background: var(--salmon);
      box-shadow: none;
      border-bottom-right-radius: 2px;
    }

    .assistant .bubble {
      border-bottom-left-radius: 2px;
    }

    .message-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 7px;
    }

    .copy {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 0;
    }

    .note {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 8px;
      color: var(--warning);
      font-size: 11px;
      font-weight: 800;
    }

    .citations {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
    }

    .citation {
      max-width: 100%;
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--sage-soft);
      color: var(--sage);
      font-size: 11px;
      font-weight: 800;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #f0c9c3;
      border-top-color: var(--salmon);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .quick {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 16px;
      background: var(--paper);
      border-top: 1px solid var(--line);
    }

    .chip {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .chip:hover,
    .icon-button:hover {
      border-color: #d1bfb4;
      background: #fff7f2;
    }

    .composer {
      display: flex;
      gap: 8px;
      padding: 8px 16px 14px;
      background: var(--paper);
      border-top: 1px solid var(--line);
    }

    input {
      flex: 1;
      min-width: 0;
      height: 46px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: #f5efeb;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: rgba(231, 111, 97, .58);
      background: white;
    }

    button.send {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 8px;
      background: var(--salmon);
      color: white;
      font-size: 13px;
      font-weight: 850;
      cursor: pointer;
    }

    button.send:hover {
      background: var(--salmon-dark);
    }

    button:disabled {
      cursor: wait;
      opacity: .55;
    }

    @media (max-width: 520px) {
      .shell {
        padding: 0;
      }

      .phone {
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        border-radius: 0;
        border: 0;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="phone">
      <header>
        <div>
          <h1>T.Salmon</h1>
          <div class="subtitle">스크린샷 정리</div>
        </div>
        <button id="resetButton" class="icon-button" type="button" title="새 대화">↻</button>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <section id="quick" class="quick" aria-label="추천 질문"></section>

      <form id="composer" class="composer">
        <input id="messageInput" autocomplete="off" placeholder="질문 입력">
        <button id="sendButton" class="send" type="submit" aria-label="전송">전송</button>
      </form>
    </section>
  </main>

  <script>
    const baseUrl = window.location.origin;
    const messagesEl = document.querySelector("#messages");
    const quickEl = document.querySelector("#quick");
    const form = document.querySelector("#composer");
    const input = document.querySelector("#messageInput");
    const sendButton = document.querySelector("#sendButton");
    const resetButton = document.querySelector("#resetButton");
    const history = [];
    let isSending = false;

    const quickPrompts = [
      { label: "요약", prompt: "최근 저장한 항목 요약해줘" },
      { label: "마감", prompt: "마감일 있는 항목만 정리해줘" },
      { label: "장소", prompt: "지도에서 볼 항목 정리해줘" },
      { label: "장학금", prompt: "장학금 관련 정보 있어?" },
      { label: "쿠폰", prompt: "쿠폰이나 기프티콘 사용기한 알려줘" },
    ];

    function addMessage(role, content, options = {}) {
      history.push({ role, content });

      const row = document.createElement("div");
      row.className = `row ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const text = document.createElement("div");
      text.textContent = content;
      bubble.append(text);

      if (role === "assistant" && options.citations?.length) {
        const citations = document.createElement("div");
        citations.className = "citations";
        options.citations.slice(0, 4).forEach((item) => {
          const chip = document.createElement("span");
          chip.className = "citation";
          const category = item.category || "미분류";
          const action = item.action_type || "해당없음";
          chip.textContent = action === "해당없음" ? category : `${category} · ${action}`;
          chip.title = item.summary || "";
          citations.append(chip);
        });
        bubble.append(citations);
      }

      if (role === "assistant" && options.provider === "local_fallback") {
        const note = document.createElement("div");
        note.className = "note";
        note.textContent = "저장된 기록 기준";
        bubble.append(note);
      }

      if (role === "assistant" && options.provider === "error") {
        const note = document.createElement("div");
        note.className = "note";
        note.textContent = "잠시 후 다시 시도";
        bubble.append(note);
      }

      if (role === "assistant") {
        const actions = document.createElement("div");
        actions.className = "message-actions";

        const copy = document.createElement("button");
        copy.className = "copy";
        copy.type = "button";
        copy.textContent = "복사";
        copy.addEventListener("click", async () => {
          await navigator.clipboard.writeText(content);
          copy.textContent = "복사됨";
          setTimeout(() => { copy.textContent = "복사"; }, 900);
        });

        actions.append(copy);
        bubble.append(actions);
      }

      row.append(bubble);
      messagesEl.append(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addTyping() {
      const row = document.createElement("div");
      row.className = "row assistant";
      row.id = "typing";
      row.innerHTML = '<div class="bubble typing"><span class="spinner"></span><span>정리 중</span></div>';
      messagesEl.append(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      document.querySelector("#typing")?.remove();
    }

    async function sendMessage(text) {
      const message = text.trim();
      if (!message || isSending) return;

      isSending = true;
      input.value = "";
      sendButton.disabled = true;
      addMessage("user", message);
      addTyping();

      try {
        const response = await fetch(`${baseUrl}/api/v1/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            user_id: "default_user",
            history: history.filter((item) => item.role === "user" || item.role === "assistant"),
          }),
        });

        if (!response.ok) throw new Error(`서버 응답 오류: ${response.status}`);
        const data = await response.json();
        removeTyping();
        addMessage("assistant", data.reply || "답변을 만들지 못했어. 다시 물어봐줘.", {
          provider: data.provider || "watsonx",
          citations: data.citations || [],
        });
      } catch {
        removeTyping();
        addMessage("assistant", "지금은 연결이 불안정해. 서버를 켠 뒤 다시 시도해줘.", {
          provider: "error",
        });
      } finally {
        isSending = false;
        sendButton.disabled = false;
        input.focus();
      }
    }

    function resetChat() {
      history.length = 0;
      messagesEl.innerHTML = "";
      addMessage("assistant", "좋아, 새로 시작하자. 어떤 스크린샷 정보를 찾을까?");
      input.focus();
    }

    quickPrompts.forEach((item) => {
      const button = document.createElement("button");
      button.className = "chip";
      button.type = "button";
      button.textContent = item.label;
      button.addEventListener("click", () => sendMessage(item.prompt));
      quickEl.append(button);
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(input.value);
    });

    resetButton.addEventListener("click", resetChat);

    addMessage("assistant", "찾고 싶은 내용을 말해줘. 저장된 스크린샷에서 필요한 것만 골라볼게.");
  </script>
</body>
</html>
