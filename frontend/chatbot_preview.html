<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watson 챗봇 미리보기</title>
  <style>
    :root {
      color-scheme: light;
      --purple: #6750a4;
      --purple-dark: #4f378b;
      --surface: #fbf8ff;
      --line: #e8def8;
      --muted: #6d6778;
      --bubble: #f4effa;
      --danger: #b3261e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f2fa;
      color: #1d1b20;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .phone {
      display: flex;
      flex-direction: column;
      width: min(100vw, 430px);
      height: 100vh;
      margin: 0 auto;
      background: white;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 8px;
    }

    .row {
      display: flex;
      margin: 7px 0;
    }

    .row.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid #ebe5ef;
      background: #f7f2fa;
      line-height: 1.38;
      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: anywhere;
      font-size: 15px;
    }

    .user .bubble {
      border: 0;
      color: white;
      background: var(--purple);
      border-bottom-right-radius: 4px;
    }

    .assistant .bubble {
      border-bottom-left-radius: 4px;
    }

    .provider {
      margin-top: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .provider.watsonx {
      color: var(--purple-dark);
    }

    .provider.error {
      color: var(--danger);
    }

    .typing {
      width: 42px;
      height: 34px;
      display: grid;
      place-items: center;
    }

    .typing::after {
      width: 16px;
      height: 16px;
      content: "";
      border: 2px solid #d0c4dc;
      border-top-color: var(--purple);
      border-radius: 999px;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .quick {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 16px;
      border-top: 1px solid var(--line);
    }

    .chip {
      flex: 0 0 auto;
      height: 36px;
      padding: 0 12px;
      border: 1px solid #d0c4dc;
      border-radius: 18px;
      background: white;
      color: #1d1b20;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .composer {
      display: flex;
      gap: 8px;
      padding: 8px 16px 14px;
      background: white;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 44px;
      padding: 0 14px;
      border: 0;
      border-radius: 16px;
      background: #f1edf4;
      font: inherit;
      font-size: 15px;
      outline: none;
    }

    button.send {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 22px;
      background: var(--purple);
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: .55;
    }
  </style>
</head>
<body>
  <main class="phone">
    <header>
      <h1>Watson 챗봇</h1>
      <div class="subtitle">watsonx Granite</div>
    </header>

    <section id="messages" class="messages" aria-live="polite"></section>

    <section id="quick" class="quick" aria-label="추천 질문"></section>

    <form id="composer" class="composer">
      <input id="messageInput" autocomplete="off" placeholder="질문 입력">
      <button id="sendButton" class="send" type="submit" aria-label="전송">➤</button>
    </form>
  </main>

  <script>
    const baseUrl = window.location.origin;
    const messagesEl = document.querySelector("#messages");
    const quickEl = document.querySelector("#quick");
    const form = document.querySelector("#composer");
    const input = document.querySelector("#messageInput");
    const sendButton = document.querySelector("#sendButton");
    const history = [];
    let isSending = false;

    const quickPrompts = [
      "최근 저장한 항목 요약해줘",
      "일정등록 항목만 알려줘",
      "지도에서 볼 항목 정리해줘",
      "장학금 관련 정보 있어?",
    ];

    function providerLabel(provider) {
      if (provider === "watsonx") return "Watsonx 응답";
      if (provider === "error") return "연결 오류";
      return "로컬 보조 응답";
    }

    function addMessage(role, content, provider) {
      history.push({ role, content });

      const row = document.createElement("div");
      row.className = `row ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = content;

      if (role === "assistant" && provider) {
        const label = document.createElement("div");
        label.className = `provider ${provider}`;
        label.textContent = providerLabel(provider);
        bubble.append(label);
      }

      row.append(bubble);
      messagesEl.append(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addTyping() {
      const row = document.createElement("div");
      row.className = "row assistant";
      row.id = "typing";
      row.innerHTML = '<div class="bubble typing"></div>';
      messagesEl.append(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      document.querySelector("#typing")?.remove();
    }

    async function sendMessage(text) {
      const message = text.trim();
      if (!message || isSending) return;

      isSending = true;
      input.value = "";
      sendButton.disabled = true;
      addMessage("user", message);
      addTyping();

      try {
        const response = await fetch(`${baseUrl}/api/v1/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            user_id: "default_user",
            history: history.filter((item) => item.role === "user" || item.role === "assistant"),
          }),
        });

        if (!response.ok) throw new Error(`서버 응답 오류: ${response.status}`);
        const data = await response.json();
        addMessage("assistant", data.reply || "답변을 생성하지 못했습니다.", data.provider || "watsonx");
      } catch (error) {
        addMessage("assistant", `챗봇 연결에 실패했습니다. 백엔드 서버가 켜져 있는지 확인해주세요.\n${error.message}`, "error");
      } finally {
        removeTyping();
        isSending = false;
        sendButton.disabled = false;
        input.focus();
      }
    }

    quickPrompts.forEach((prompt) => {
      const button = document.createElement("button");
      button.className = "chip";
      button.type = "button";
      button.textContent = `✨ ${prompt}`;
      button.addEventListener("click", () => sendMessage(prompt));
      quickEl.append(button);
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(input.value);
    });

    addMessage("assistant", "안녕하세요. 저장된 스크린샷 분석 결과를 바탕으로 바로 정리해드릴게요.");
  </script>
</body>
</html>
