<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watson 챗봇 미리보기</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d1b20;
      --muted: #6f6877;
      --line: #e7dff0;
      --purple: #6750a4;
      --purple-deep: #4f378b;
      --purple-soft: #f4effa;
      --green: #146c43;
      --amber: #8a5a00;
      --red: #b3261e;
      --surface: #fffbff;
      --surface-2: #f7f2fa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(90deg, rgba(103, 80, 164, .08), transparent 34%),
        #f5f1f8;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .shell {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .phone {
      display: flex;
      flex-direction: column;
      width: min(100%, 430px);
      height: min(860px, calc(100vh - 40px));
      min-height: 680px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 18px 48px rgba(38, 31, 47, .18);
      overflow: hidden;
    }

    header {
      padding: 18px 18px 12px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
    }

    .topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .status-pill {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      color: var(--purple-deep);
      font-size: 12px;
      font-weight: 800;
    }

    .status-panel {
      margin-top: 14px;
      padding: 12px;
      border: 1px solid rgba(103, 80, 164, .2);
      border-radius: 8px;
      background: white;
    }

    .status-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--purple-deep);
      font-size: 14px;
      font-weight: 800;
    }

    .status-copy {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .metric {
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
      font-size: 11px;
      font-weight: 750;
    }

    .toolbar {
      display: flex;
      gap: 6px;
    }

    .icon-button {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 10px;
    }

    .row {
      display: flex;
      margin: 7px 0;
    }

    .row.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 84%;
      padding: 11px 13px;
      border: 1px solid #ebe5ef;
      border-radius: 8px;
      background: #f7f2fa;
      line-height: 1.42;
      white-space: pre-wrap;
      word-break: keep-all;
      overflow-wrap: anywhere;
      font-size: 15px;
    }

    .user .bubble {
      border-color: transparent;
      color: white;
      background: var(--purple);
      border-bottom-right-radius: 2px;
    }

    .assistant .bubble {
      border-bottom-left-radius: 2px;
    }

    .message-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
    }

    .provider {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .provider.watsonx {
      color: var(--purple-deep);
    }

    .provider.error {
      color: var(--red);
    }

    .provider.local_fallback {
      color: var(--amber);
    }

    .copy {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 0;
    }

    .notice {
      margin-top: 8px;
      padding: 8px;
      border: 1px solid rgba(138, 90, 0, .18);
      border-radius: 8px;
      background: rgba(138, 90, 0, .07);
      color: #5c3b00;
      font-size: 12px;
      line-height: 1.35;
    }

    .citations {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .citation {
      max-width: 100%;
      padding: 5px 8px;
      border: 1px solid #ddd2e8;
      border-radius: 8px;
      background: white;
      font-size: 11px;
      font-weight: 750;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .typing {
      width: 112px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #d0c4dc;
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .quick {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 16px;
      border-top: 1px solid var(--line);
      background: white;
    }

    .chip {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid #d0c4dc;
      border-radius: 8px;
      background: white;
      color: #1d1b20;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    .chip strong {
      color: var(--purple-deep);
    }

    .composer {
      display: flex;
      gap: 8px;
      padding: 8px 16px 14px;
      background: white;
      border-top: 1px solid var(--line);
    }

    input {
      flex: 1;
      min-width: 0;
      height: 46px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: #f1edf4;
      font: inherit;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: rgba(103, 80, 164, .44);
      background: white;
    }

    button.send {
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 8px;
      background: var(--purple);
      color: white;
      font-size: 14px;
      font-weight: 850;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: .55;
    }

    @media (max-width: 520px) {
      .shell {
        padding: 0;
      }

      .phone {
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        border-radius: 0;
        border: 0;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="phone">
      <header>
        <div class="topline">
          <div>
            <h1>Watson 챗봇</h1>
            <div class="subtitle">watsonx Granite · screenshot assistant</div>
          </div>
          <div class="toolbar">
            <button id="resetButton" class="icon-button" type="button" title="대화 초기화">↺</button>
          </div>
        </div>

        <section class="status-panel">
          <div class="status-title">
            <span id="statusTitle">챗봇 준비됨</span>
            <span id="statusPill" class="status-pill">READY</span>
          </div>
          <div id="statusCopy" class="status-copy">질문을 보내면 저장된 스크린샷 기록과 Watsonx 연결 상태를 같이 확인합니다.</div>
          <div class="metrics">
            <span id="modelMetric" class="metric">model: checking</span>
            <span id="sourceMetric" class="metric">source: none</span>
            <span id="citationMetric" class="metric">citations: 0</span>
          </div>
        </section>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <section id="quick" class="quick" aria-label="추천 질문"></section>

      <form id="composer" class="composer">
        <input id="messageInput" autocomplete="off" placeholder="질문 입력">
        <button id="sendButton" class="send" type="submit" aria-label="전송">SEND</button>
      </form>
    </section>
  </main>

  <script>
    const baseUrl = window.location.origin;
    const messagesEl = document.querySelector("#messages");
    const quickEl = document.querySelector("#quick");
    const form = document.querySelector("#composer");
    const input = document.querySelector("#messageInput");
    const sendButton = document.querySelector("#sendButton");
    const resetButton = document.querySelector("#resetButton");
    const statusTitle = document.querySelector("#statusTitle");
    const statusPill = document.querySelector("#statusPill");
    const statusCopy = document.querySelector("#statusCopy");
    const modelMetric = document.querySelector("#modelMetric");
    const sourceMetric = document.querySelector("#sourceMetric");
    const citationMetric = document.querySelector("#citationMetric");
    const history = [];
    let isSending = false;

    const quickPrompts = [
      { label: "요약", prompt: "최근 저장한 항목 요약해줘" },
      { label: "일정", prompt: "일정등록 항목만 알려줘" },
      { label: "지도", prompt: "지도에서 볼 항목 정리해줘" },
      { label: "장학금", prompt: "장학금 관련 정보 있어?" },
      { label: "링크", prompt: "바로 열어볼 링크만 정리해줘" },
    ];

    function providerLabel(provider) {
      if (provider === "watsonx") return "Watsonx 응답";
      if (provider === "error") return "연결 오류";
      if (provider === "local_fallback") return "로컬 보조 응답";
      return "대기";
    }

    function setStatus(provider, notice, model, citationCount) {
      const fallbackNotice = {
        watsonx: "Watsonx Granite 모델이 응답했습니다.",
        local_fallback: "서버는 정상이고 Watsonx 대신 로컬 보조 응답으로 전환했습니다.",
        error: "백엔드 서버 또는 네트워크 연결을 확인해주세요.",
        loading: "스크린샷 기록과 Watsonx 응답을 확인하고 있습니다.",
        idle: "질문을 보내면 저장된 스크린샷 기록과 Watsonx 연결 상태를 같이 확인합니다.",
      };

      const title = {
        watsonx: "Watsonx 연결됨",
        local_fallback: "서버 연결됨",
        error: "연결 오류",
        loading: "응답 생성 중",
        idle: "챗봇 준비됨",
      };

      statusTitle.textContent = title[provider] || title.idle;
      statusPill.textContent = provider === "watsonx"
        ? "WATSONX"
        : provider === "local_fallback"
          ? "FALLBACK"
          : provider === "error"
            ? "ERROR"
            : provider === "loading"
              ? "WAIT"
              : "READY";
      statusCopy.textContent = notice || fallbackNotice[provider] || fallbackNotice.idle;
      modelMetric.textContent = `model: ${model || "ibm/granite-3-8b-instruct"}`;
      sourceMetric.textContent = `source: ${providerLabel(provider)}`;
      citationMetric.textContent = `citations: ${citationCount || 0}`;
    }

    function addMessage(role, content, options = {}) {
      history.push({ role, content });

      const row = document.createElement("div");
      row.className = `row ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const text = document.createElement("div");
      text.textContent = content;
      bubble.append(text);

      if (role === "assistant" && options.notice && options.provider !== "watsonx") {
        const notice = document.createElement("div");
        notice.className = "notice";
        notice.textContent = options.notice;
        bubble.append(notice);
      }

      if (role === "assistant" && options.citations?.length) {
        const citations = document.createElement("div");
        citations.className = "citations";
        options.citations.slice(0, 4).forEach((item) => {
          const chip = document.createElement("span");
          chip.className = "citation";
          const category = item.category || "미분류";
          const action = item.action_type || "해당없음";
          chip.textContent = `${category} · ${action}`;
          chip.title = item.summary || "";
          citations.append(chip);
        });
        bubble.append(citations);
      }

      if (role === "assistant" && options.provider) {
        const meta = document.createElement("div");
        meta.className = "message-meta";

        const label = document.createElement("span");
        label.className = `provider ${options.provider}`;
        label.textContent = providerLabel(options.provider);

        const copy = document.createElement("button");
        copy.className = "copy";
        copy.type = "button";
        copy.textContent = "복사";
        copy.addEventListener("click", async () => {
          await navigator.clipboard.writeText(content);
          copy.textContent = "복사됨";
          setTimeout(() => { copy.textContent = "복사"; }, 900);
        });

        meta.append(label, copy);
        bubble.append(meta);
      }

      row.append(bubble);
      messagesEl.append(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addTyping() {
      const row = document.createElement("div");
      row.className = "row assistant";
      row.id = "typing";
      row.innerHTML = '<div class="bubble typing"><span class="spinner"></span><span>답변 생성 중</span></div>';
      messagesEl.append(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      document.querySelector("#typing")?.remove();
    }

    async function loadStatus() {
      try {
        const response = await fetch(`${baseUrl}/api/v1/chat/status`);
        const data = await response.json();
        setStatus("idle", data.message, data.model, 0);
      } catch {
        setStatus("error", "백엔드 서버 상태를 확인하지 못했습니다.", null, 0);
      }
    }

    async function sendMessage(text) {
      const message = text.trim();
      if (!message || isSending) return;

      isSending = true;
      input.value = "";
      sendButton.disabled = true;
      setStatus("loading", null, null, 0);
      addMessage("user", message);
      addTyping();

      try {
        const response = await fetch(`${baseUrl}/api/v1/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            user_id: "default_user",
            history: history.filter((item) => item.role === "user" || item.role === "assistant"),
          }),
        });

        if (!response.ok) throw new Error(`서버 응답 오류: ${response.status}`);
        const data = await response.json();
        removeTyping();
        addMessage("assistant", data.reply || "답변을 생성하지 못했습니다.", {
          provider: data.provider || "watsonx",
          notice: data.notice,
          citations: data.citations || [],
        });
        setStatus(data.provider || "watsonx", data.notice, data.model, (data.citations || []).length);
      } catch (error) {
        removeTyping();
        addMessage("assistant", `챗봇 연결에 실패했습니다.\n${error.message}`, {
          provider: "error",
          notice: "백엔드 서버가 켜져 있는지 확인해주세요.",
        });
        setStatus("error", "백엔드 서버가 켜져 있는지 확인해주세요.", null, 0);
      } finally {
        isSending = false;
        sendButton.disabled = false;
        input.focus();
      }
    }

    function resetChat() {
      history.length = 0;
      messagesEl.innerHTML = "";
      setStatus("idle", null, null, 0);
      addMessage("assistant", "대화를 초기화했습니다. 챗봇 UI와 응답 흐름을 다시 확인해보세요.");
      input.focus();
    }

    quickPrompts.forEach((item) => {
      const button = document.createElement("button");
      button.className = "chip";
      button.type = "button";
      button.innerHTML = `<strong>${item.label}</strong> · ${item.prompt}`;
      button.addEventListener("click", () => sendMessage(item.prompt));
      quickEl.append(button);
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(input.value);
    });

    resetButton.addEventListener("click", resetChat);

    addMessage("assistant", "안녕하세요. 저장된 스크린샷 분석 결과를 바탕으로 바로 정리해드릴게요.");
    loadStatus();
  </script>
</body>
</html>
